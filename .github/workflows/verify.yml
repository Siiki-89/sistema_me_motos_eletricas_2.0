name: Tests ME Estoque
on:
  pull_request:
  push:
    branches: [main, chatgpt/finalizacao-me-estoque]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run --project server --project web
      # Tooling test suite is Windows-specific and requires an installed local runtime.
      # It remains part of the Windows workstation verification process.
